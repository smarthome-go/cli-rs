[package]
name = "smarthome-cli"
version = "0.2.0"
edition = "2024"
description = "Command-line interface for the Smarthome server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "shome"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
indicatif = "0.18.6"
log = { version = "0.4.28", features = ["std"] }
rustyline = "18.0.1"
rustyline-derive = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
# Use the local SDK until 0.14.0 is published.
smarthome-sdk-rs = { version = "0.14.0", path = "../sdk-rs" }
tabled = { version = "0.22.0", features = ["ansi", "derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
